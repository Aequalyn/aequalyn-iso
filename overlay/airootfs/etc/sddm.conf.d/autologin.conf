# Aequalyn live ISO: log the `live` user straight into the desktop.
# SDDM creates the logind seat/session, XDG_RUNTIME_DIR and the systemd user
# bus -- the pieces the old getty@tty1 autologin lacked, which made Hyprland
# crash-loop. `aequalyn` is our guarded Wayland session (see
# /usr/share/wayland-sessions/aequalyn.desktop); it runs start-hyprland once.
[Autologin]
User=live
Session=aequalyn
# Only the boot login is SDDM's: it cannot tell a log out from a crash and would
# loop on a desktop that cannot start. Log out still skips the greeter:
# aequalyn-logout asks aequalyn-live-session for a fresh desktop instead.
Relogin=false
