# Used by aequalyn-install for a fully offline install. The repository is bundled
# in the ISO at /var/cache/offline-repo (built by bin/aequalyn-iso-make).
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
SigLevel    = Never
LocalFileSigLevel = Optional

[offline]
SigLevel = Never
Server = file:///var/cache/offline-repo/
